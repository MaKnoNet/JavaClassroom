<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernfortschritt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%2316a34a%27/%3E%3C/svg%3E">
<style>
  :root { color-scheme:light; --bg:#f6f7f9; --karte:#fff; --text:#1f2933; --grau:#6b7280; --rand:#e5e7eb;
          --fertig:#15803d; --begonnen:#b45309; --offen:#e5e7eb; --fokus:#2563eb;
          --hover:#eef2ff; --befehl-bg:#eef2ff; --befehl-rand:#c7d2fe; --notiz-bg:#fffbeb;
          --stufe-1:#15803d; --stufe-2:#2563eb; --stufe-3:#7c3aed; }
  /* Dunkle Palette: alle Textkontraste >= 4,5:1 auf der Karte (#1f2937) nachgerechnet. */
  :root[data-theme="dark"] { color-scheme:dark; --bg:#111827; --karte:#1f2937; --text:#e5e7eb; --grau:#9ca3af; --rand:#374151;
          --fertig:#4ade80; --begonnen:#fbbf24; --offen:#374151; --fokus:#60a5fa;
          --hover:#374151; --befehl-bg:#1e3a5f; --befehl-rand:#3b82f6; --notiz-bg:#3b2f0b;
          --stufe-1:#15803d; --stufe-2:#2563eb; --stufe-3:#7c3aed; }
  body { margin:0; padding:2rem; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:1rem 2rem; align-items:baseline; margin-bottom:1.5rem; }
  h1 { margin:0; font-size:1.6rem; }
  .profil { color:var(--grau); font-size:.95rem; }
  .gesamt, .thema { background:var(--karte); border:1px solid var(--rand); border-radius:.75rem; padding:1rem 1.25rem; }
  .gesamt { margin-bottom:1.5rem; }
  .legende { display:flex; flex-wrap:wrap; gap:.4rem 1.25rem; margin-top:.75rem; font-size:.85rem; color:var(--grau); }
  .legende span { display:inline-flex; align-items:center; gap:.4rem; }
  .legende .stufe { flex:0 0 1.8rem; display:inline-block; text-align:center; }
  .legende .status { width:auto; }
  .balken { height:.6rem; background:var(--offen); border-radius:999px; overflow:hidden; }
  .balken > div { height:100%; background:var(--fertig); }
  .themen { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1rem; }
  .thema h2 { margin:0 0 .5rem; font-size:1.15rem; display:flex; justify-content:space-between; }
  .thema .zahl { color:var(--grau); font-weight:normal; font-size:.95rem; }
  .thema.gesperrt { border-style:dashed; }
  .thema.gesperrt h2 { color:var(--grau); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  ul { list-style:none; padding:0; margin:.75rem 0 0; }
  li { display:flex; gap:.5rem; padding:.2rem 0; font-size:.95rem; }
  li.lektion { padding:0; }
  li.lektion > button { all:unset; box-sizing:border-box; display:flex; gap:.5rem; align-items:center; width:100%; min-height:1.75rem; padding:.2rem .3rem; border-radius:.3rem; cursor:pointer; color:var(--text); }
  li.lektion.offen > button { color:var(--grau); }
  li .nummer { flex:0 0 1.5rem; font-variant-numeric:tabular-nums; }
  li .titel { flex:1; }
  li .datum { color:var(--grau); font-size:.85rem; white-space:nowrap; }
  .status { width:1.2rem; text-align:center; }
  /* Feste Spalte zwischen Nummer und Titel, damit die Stufen untereinander eine ruhige Kante bilden. */
  .stufe { flex:0 0 1.8rem; text-align:center; font-size:.7rem; font-weight:600; padding:.1rem 0; border-radius:.3rem; color:#fff; align-self:center; }
  .stufe.leer { visibility:hidden; }
  .stufe-1 { background:var(--stufe-1); } .stufe-2 { background:var(--stufe-2); } .stufe-3 { background:var(--stufe-3); }
  .fertig .status { color:var(--fertig); }
  .begonnen .status { color:var(--begonnen); }
  .notizen { margin-top:.75rem; padding:.5rem .75rem; background:var(--notiz-bg); border-left:3px solid var(--begonnen); font-size:.9rem; }
  .hinweis { color:var(--grau); font-size:.85rem; margin-top:.5rem; }
  li.lektion > button:hover { background:var(--hover); }
  .theme { margin-left:auto; font:inherit; font-size:.9rem; padding:.25rem .6rem; border:1px solid var(--rand); border-radius:999px; background:var(--karte); color:var(--text); cursor:pointer; }
  .theme:hover { background:var(--hover); }
  .theme:focus-visible { outline:2px solid var(--fokus); outline-offset:2px; }
  li.lektion > button:focus-visible, .befehl button:focus-visible, select:focus-visible { outline:2px solid var(--fokus); outline-offset:2px; }
  .profil select { font:inherit; color:inherit; border:1px solid var(--rand); border-radius:.3rem; padding:.1rem .3rem; background:var(--karte); }
  .befehl { display:none; align-items:center; gap:.75rem; flex-wrap:wrap; background:var(--befehl-bg); border:1px solid var(--befehl-rand); border-radius:.75rem; padding:.75rem 1rem; margin-bottom:1.5rem; }
  .befehl.sichtbar { display:flex; }
  .befehl code { font-size:1.05rem; background:var(--karte); padding:.25rem .5rem; border-radius:.3rem; }
  .befehl button { color:var(--text); font:inherit; padding:.3rem .7rem; border:1px solid var(--befehl-rand); border-radius:.3rem; background:var(--karte); cursor:pointer; }
  .befehl .ok { color:var(--fertig); font-size:.9rem; }
</style>
</head>
<body>
<header><h1>Lernfortschritt</h1><div class="profil" id="profil"></div><button class="theme" id="theme-schalter" type="button" aria-pressed="false"></button></header>
<main>
<section class="befehl" id="befehl" aria-labelledby="befehl-titel"><span id="befehl-titel">In Claude Code eingeben:</span><code id="befehl-text"></code><button id="befehl-kopieren" type="button">Kopieren</button><span class="ok" id="befehl-ok" role="status" aria-live="polite"></span></section>
<section class="gesamt" id="gesamt" aria-label="Gesamt"></section>
<section class="themen" id="themen" aria-label="Themen"></section>
</main>
<script>
const DATEN = /*DATEN*/{};
const TEXTE = {
  de: { stufen: ["Anfänger", "Fortgeschritten", "Erfahren"], dunkel: "Dunkel", hell: "Hell", gesperrt: "gesperrt", bereichGesamt: "Gesamtfortschritt", bereichThemen: "Themen", status: { fertig: "fertig", begonnen: "begonnen", offen: "offen" },
        titel: "Lernfortschritt", stufe: "Stufe", eingeben: "In Claude Code eingeben:", kopieren: "Kopieren", sprache: "Sprache",
        klick: "Klicken: Lektion starten", wechsel: "Wechsel erzeugt einen Befehl für Claude Code",
        voraussetzung: "Voraussetzung noch offen", letzte: "Letzte Stunde", naechstes: "Nächstes Mal",
        gesamt: (f, a, p) => `Gesamt: ${f} von ${a} Lektionen (${p} %)`,
        gesendet: "an den Lehrer gesendet – schau in den Chat", nichtErreichbar: "Server nicht erreichbar – Befehl kopieren und im Chat einfügen",
        kopiert: "kopiert – im Chat einfügen", markiert: "markiert – mit Strg+C kopieren" },
  en: { stufen: ["Beginner", "Advanced", "Experienced"], dunkel: "Dark", hell: "Light", gesperrt: "locked", bereichGesamt: "Overall progress", bereichThemen: "Topics", status: { fertig: "done", begonnen: "started", offen: "open" },
        titel: "Learning progress", stufe: "Level", eingeben: "Type into Claude Code:", kopieren: "Copy", sprache: "Language",
        klick: "Click to start this lesson", wechsel: "Changing creates a command for Claude Code",
        voraussetzung: "Prerequisite not finished", letzte: "Last session", naechstes: "Next time",
        gesamt: (f, a, p) => `Total: ${f} of ${a} lessons (${p} %)`,
        gesendet: "sent to the teacher – check the chat", nichtErreichbar: "Server not reachable – copy the command into the chat",
        kopiert: "copied – paste into the chat", markiert: "selected – copy with Ctrl+C" },
  fr: { stufen: ["Débutant", "Avancé", "Expérimenté"], dunkel: "Sombre", hell: "Clair", gesperrt: "verrouillé", bereichGesamt: "Progression globale", bereichThemen: "Thèmes", status: { fertig: "terminée", begonnen: "commencée", offen: "ouverte" },
        titel: "Progression", stufe: "Niveau", eingeben: "Saisir dans Claude Code :", kopieren: "Copier", sprache: "Langue",
        klick: "Cliquer pour démarrer cette leçon", wechsel: "Le changement crée une commande pour Claude Code",
        voraussetzung: "Prérequis non terminé", letzte: "Dernière séance", naechstes: "La prochaine fois",
        gesamt: (f, a, p) => `Total : ${f} sur ${a} leçons (${p} %)`,
        gesendet: "envoyé au professeur – regarde le chat", nichtErreichbar: "Serveur injoignable – copier la commande dans le chat",
        kopiert: "copié – coller dans le chat", markiert: "sélectionné – copier avec Ctrl+C" },
  es: { stufen: ["Principiante", "Avanzado", "Experimentado"], dunkel: "Oscuro", hell: "Claro", gesperrt: "bloqueado", bereichGesamt: "Progreso total", bereichThemen: "Temas", status: { fertig: "terminada", begonnen: "empezada", offen: "abierta" },
        titel: "Progreso", stufe: "Nivel", eingeben: "Escribir en Claude Code:", kopieren: "Copiar", sprache: "Idioma",
        klick: "Clic para empezar esta lección", wechsel: "El cambio crea un comando para Claude Code",
        voraussetzung: "Requisito previo pendiente", letzte: "Última sesión", naechstes: "La próxima vez",
        gesamt: (f, a, p) => `Total: ${f} de ${a} lecciones (${p} %)`,
        gesendet: "enviado al profesor – mira el chat", nichtErreichbar: "Servidor no disponible – copia el comando en el chat",
        kopiert: "copiado – pégalo en el chat", markiert: "seleccionado – copia con Ctrl+C" },
  it: { stufen: ["Principiante", "Avanzato", "Esperto"], dunkel: "Scuro", hell: "Chiaro", gesperrt: "bloccato", bereichGesamt: "Progresso complessivo", bereichThemen: "Temi", status: { fertig: "completata", begonnen: "iniziata", offen: "aperta" },
        titel: "Progressi", stufe: "Livello", eingeben: "Digita in Claude Code:", kopieren: "Copia", sprache: "Lingua",
        klick: "Clicca per iniziare questa lezione", wechsel: "Il cambio crea un comando per Claude Code",
        voraussetzung: "Prerequisito non completato", letzte: "Ultima sessione", naechstes: "La prossima volta",
        gesamt: (f, a, p) => `Totale: ${f} di ${a} lezioni (${p} %)`,
        gesendet: "inviato all'insegnante – guarda la chat", nichtErreichbar: "Server non raggiungibile – copia il comando nella chat",
        kopiert: "copiato – incolla nella chat", markiert: "selezionato – copia con Ctrl+C" },
  tr: { stufen: ["Başlangıç", "İleri", "Deneyimli"], dunkel: "Koyu", hell: "Açık", gesperrt: "kilitli", bereichGesamt: "Genel ilerleme", bereichThemen: "Konular", status: { fertig: "tamamlandı", begonnen: "başlandı", offen: "açık" },
        titel: "Öğrenme ilerlemesi", stufe: "Seviye", eingeben: "Claude Code'a yaz:", kopieren: "Kopyala", sprache: "Dil",
        klick: "Dersi başlatmak için tıkla", wechsel: "Değişiklik Claude Code için bir komut oluşturur",
        voraussetzung: "Ön koşul tamamlanmadı", letzte: "Son ders", naechstes: "Bir dahaki sefere",
        gesamt: (f, a, p) => `Toplam: ${a} dersten ${f} (%${p})`,
        gesendet: "öğretmene gönderildi – sohbete bak", nichtErreichbar: "Sunucuya ulaşılamıyor – komutu sohbete kopyala",
        kopiert: "kopyalandı – sohbete yapıştır", markiert: "seçildi – Ctrl+C ile kopyala" },
};
let sprache = DATEN.profil.sprache in TEXTE ? DATEN.profil.sprache : "de";

// Hell/Dunkel: gespeicherte Wahl gewinnt, sonst die Systemeinstellung. Gesetzt vor dem
// ersten Rendern, damit die Seite nicht hell aufblitzt.
const THEME_SCHLUESSEL = "fortschritt-theme";
function gespeichertesTheme() {
  try { return localStorage.getItem(THEME_SCHLUESSEL); } catch (e) { return null; }
}
function aktuellesTheme() {
  const gespeichert = gespeichertesTheme();
  if (gespeichert === "dark" || gespeichert === "light") return gespeichert;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function setzeTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const schalter = document.getElementById("theme-schalter");
  const dunkel = theme === "dark";
  // Der Knopf zeigt, wohin er schaltet – nicht, was gerade ist.
  schalter.textContent = dunkel ? "\u2600 " + t("hell") : "\u263E " + t("dunkel");
  schalter.setAttribute("aria-pressed", String(dunkel));
}
setzeTheme(aktuellesTheme());
function t(schluessel) { return TEXTE[sprache][schluessel]; }
function lektionsTitel(l) { return (l.uebersetzungen && l.uebersetzungen[sprache]) || l.titel; }
const SYMBOL = { fertig: "✔", begonnen: "▶", offen: "○" };

function standVon(thema) {
  return DATEN.stand[thema] || { lektionen: [], notizen: null };
}

function lektionenMitStatus(plan) {
  const stand = standVon(plan.thema);
  return plan.lektionen.map(l => {
    const s = stand.lektionen.find(x => x.nummer === l.nummer);
    return { ...l, status: s ? s.status : "offen", datum: s ? s.datum : null };
  });
}

function istFertig(thema) {
  const plan = DATEN.lehrplaene.find(p => p.thema === thema);
  if (!plan) return true;
  return lektionenMitStatus(plan).every(l => l.status === "fertig");
}

function fehlendeVoraussetzungen(plan) {
  return plan.voraussetzungen.filter(v => !istFertig(v));
}

function letztesDatum(lektionen) {
  return lektionen.map(l => l.datum).filter(Boolean).sort().pop() || null;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function karte(plan) {
  const lektionen = lektionenMitStatus(plan);
  const fertig = lektionen.filter(l => l.status === "fertig").length;
  const fehlend = fehlendeVoraussetzungen(plan);
  const prozent = lektionen.length ? Math.round(100 * fertig / lektionen.length) : 0;
  const stand = standVon(plan.thema);
  const datum = letztesDatum(lektionen);
  const zeilen = lektionen.map(l =>
    `<li class="lektion ${l.status}"><button type="button" data-befehl="/lernen ${plan.thema} ${l.nummer}" title="${t("klick")}">` +
    `<span class="status" role="img" aria-label="${t("status")[l.status]}">${SYMBOL[l.status]}</span>` +
    `<span class="nummer">${l.nummer}</span>` +
    (l.stufe ? `<span class="stufe stufe-${l.stufe}" title="${t("stufe")} ${l.stufe}"><span aria-hidden="true">S${l.stufe}</span><span class="sr-only">${t("stufe")} ${l.stufe}</span></span>`
             : `<span class="stufe leer" aria-hidden="true"></span>`) +
    `<span class="titel">${escapeHtml(lektionsTitel(l))}</span>` +
    (l.datum ? `<span class="datum">${l.datum}</span>` : "") +
    `</button></li>`).join("");
  return `<article class="thema ${fehlend.length ? "gesperrt" : ""}">
    <h2><span>${fehlend.length ? `<span aria-hidden="true">🔒 </span><span class="sr-only">${t("gesperrt")}: </span>` : ""}${escapeHtml(plan.titel)}</span><span class="zahl"><span class="sr-only">, </span>${fertig} / ${lektionen.length}</span></h2>
    <div class="balken" aria-hidden="true"><div style="width:${prozent}%"></div></div>
    ${fehlend.length ? `<div class="hinweis">${t("voraussetzung")}: ${fehlend.map(escapeHtml).join(", ")}</div>` : ""}
    ${datum ? `<div class="hinweis">${t("letzte")}: ${datum}</div>` : ""}
    <ul>${zeilen}</ul>
    ${stand.notizen ? `<div class="notizen">${t("naechstes")}: ${escapeHtml(stand.notizen)}</div>` : ""}
  </article>`;
}

function render() {
  const p = DATEN.profil;
  document.title = t("titel");
  document.documentElement.lang = sprache;
  document.querySelector("h1").textContent = t("titel");
  setzeTheme(aktuellesTheme());
  document.getElementById("befehl-titel").textContent = t("eingeben");
  document.getElementById("gesamt").setAttribute("aria-label", t("bereichGesamt"));
  document.getElementById("themen").setAttribute("aria-label", t("bereichThemen"));
  document.getElementById("befehl-kopieren").textContent = t("kopieren");
  const sprachen = [["de", "Deutsch"], ["en", "English"], ["fr", "Français"], ["es", "Español"], ["it", "Italiano"], ["tr", "Türkçe"]];
  if (p.sprache && !sprachen.some(s => s[0] === p.sprache)) sprachen.push([p.sprache, p.sprache]);
  const optionen = sprachen.map(([code, name]) => `<option value="${code}" ${code === sprache ? "selected" : ""}>${name}</option>`).join("");
  document.getElementById("profil").innerHTML =
    `${escapeHtml(p.name)} · ${escapeHtml(p.rolle)}${p.niveau ? " (" + escapeHtml(p.niveau) + ")" : ""} · ` +
    `<label>${t("sprache")} <select id="sprache" aria-describedby="sprache-hinweis">${optionen}</select></label><span class="sr-only" id="sprache-hinweis">${t("wechsel")}</span> · IDE ${escapeHtml(p.ide)}`;
  let gesamtFertig = 0, gesamtAlle = 0;
  for (const plan of DATEN.lehrplaene) {
    const lektionen = lektionenMitStatus(plan);
    gesamtFertig += lektionen.filter(l => l.status === "fertig").length;
    gesamtAlle += lektionen.length;
  }
  const gesamtProzent = gesamtAlle ? Math.round(100 * gesamtFertig / gesamtAlle) : 0;
  document.getElementById("gesamt").innerHTML =
    `<strong>${t("gesamt")(gesamtFertig, gesamtAlle, gesamtProzent)}</strong>` +
    `<div class="balken" style="margin-top:.5rem" aria-hidden="true"><div style="width:${gesamtProzent}%"></div></div>` +
    `<div class="legende">` +
    [1, 2, 3].map(n => `<span><span class="stufe stufe-${n}" aria-hidden="true">S${n}</span>${t("stufe")} ${n}: ${t("stufen")[n - 1]}</span>`).join("") +
    ["offen", "begonnen", "fertig"].map(st => `<span class="${st}"><span class="status" aria-hidden="true">${SYMBOL[st]}</span>${t("status")[st]}</span>`).join("") +
    `</div>`;
  document.getElementById("themen").innerHTML = DATEN.lehrplaene.map(karte).join("");
}

function zeigeBefehl(text, fokusAufKopieren) {
  document.getElementById("befehl-text").textContent = text;
  document.getElementById("befehl-ok").textContent = "";
  document.getElementById("befehl").classList.add("sichtbar");
  const ruhig = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: ruhig ? "auto" : "smooth" });
  // Tastatur- und Screenreader-Nutzer landen direkt beim nächsten sinnvollen Schritt.
  if (fokusAufKopieren) document.getElementById("befehl-kopieren").focus({ preventScroll: true });
  sendeKlick(text);
}

// Läuft die Seite über den lokalen Server (jwebserver), landet jeder Klick als Zeile im
// Server-Log; Claude Code überwacht das Log und reagiert ohne Chat-Eingabe.
async function sendeKlick(text) {
  if (!location.protocol.startsWith("http")) return;
  const pfad = location.pathname + "?klick=" + text.replace(/^\//, "").split(/\s+/).map(encodeURIComponent).join("/");
  const ok = document.getElementById("befehl-ok");
  try {
    await fetch(pfad, { cache: "no-store" });
    ok.textContent = t("gesendet");
  } catch (e) {
    ok.textContent = t("nichtErreichbar");
  }
}

render();

document.getElementById("themen").addEventListener("click", ev => {
  const knopf = ev.target.closest("button[data-befehl]");
  if (knopf) zeigeBefehl(knopf.dataset.befehl, true);
});
function bindeSprachwahl() {
  document.getElementById("sprache").addEventListener("change", ev => {
    const neu = ev.target.value;
    if (neu in TEXTE) { sprache = neu; render(); bindeSprachwahl(); }
    zeigeBefehl(`/lernen sprache ${neu}`);
  });
}
bindeSprachwahl();
document.getElementById("theme-schalter").addEventListener("click", () => {
  const neu = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_SCHLUESSEL, neu); } catch (e) { /* privater Modus: Wahl gilt nur für diese Seite */ }
  setzeTheme(neu);
});
document.getElementById("befehl-kopieren").addEventListener("click", async () => {
  const text = document.getElementById("befehl-text").textContent;
  const ok = document.getElementById("befehl-ok");
  try {
    await navigator.clipboard.writeText(text);
    ok.textContent = t("kopiert");
  } catch (e) {
    const bereich = document.createRange();
    bereich.selectNodeContents(document.getElementById("befehl-text"));
    const auswahl = window.getSelection();
    auswahl.removeAllRanges();
    auswahl.addRange(bereich);
    ok.textContent = t("markiert");
  }
});
</script>
</body>
</html>
