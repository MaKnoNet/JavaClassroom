plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Quellen enthalten Umlaute; ohne diese Zeile nimmt javac unter Windows Cp1252.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    // Resilience4j: Circuit Breaker, Retry, Rate Limiter – als Annotationen, deshalb AOP.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // Bringt JUnit 5, Mockito und die Spring-Testunterstuetzung mit.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Mockito lädt zur Laufzeit einen Agenten; ohne diesen Schalter warnt Java 21 davor.
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
