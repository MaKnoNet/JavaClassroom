# Schutzschalter "wetter": Nach 3 Aufrufen wird bewertet; ab 50 % Fehlern öffnet er sich
# und bleibt 10 Sekunden offen, bevor er einen Probeaufruf durchlässt (HALF_OPEN).
resilience4j.circuitbreaker.instances.wetter.sliding-window-size=3
resilience4j.circuitbreaker.instances.wetter.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.wetter.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.wetter.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.wetter.permitted-number-of-calls-in-half-open-state=1
