plugins {
    id 'java'
    // Shadow packt Anwendung und Abhängigkeiten in ein JAR. Seit 2024 unter `com.gradleup`,
    // die alte Kennung `com.github.johnrengelman.shadow` funktioniert mit Gradle 9 nicht mehr.
    id 'com.gradleup.shadow' version '9.2.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Quellen enthalten Umlaute; ohne diese Zeile nimmt javac unter Windows Cp1252.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
}

jar {
    manifest {
        attributes 'Main-Class': 'de.makno.lernen.App'
    }
}
// `./gradlew shadowJar` erzeugt build/libs/app-all.jar – das Manifest übernimmt Shadow aus `jar`.
