plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Quellen enthalten Umlaute; ohne diese Zeile nimmt javac unter Windows Cp1252.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Nur der Test braucht JUnit – Anwendungscode darf es nicht einmal sehen.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Der Treiber wird nie importiert, muss aber zur Laufzeit da sein (DriverManager findet ihn selbst).
    runtimeOnly 'com.h2database:h2:2.3.232'
    // Nur Annotationen: der Compiler will sie sehen, zur Laufzeit interessieren sie niemanden.
    compileOnly 'org.jetbrains:annotations:24.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
