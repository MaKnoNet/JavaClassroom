# Version Catalog: eine Stelle für alle Versionen. Gradle liest die Datei automatisch
# und stellt sie im Build als `libs` bereit.

[versions]
junit = "5.10.2"
mockito = "5.11.0"
h2 = "2.3.232"
jetbrains-annotations = "24.1.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }          # Version kommt aus der BOM
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

[bundles]
# Was jedes Testprojekt braucht – eine Zeile statt zwei.
test = ["junit-jupiter", "mockito-core"]
