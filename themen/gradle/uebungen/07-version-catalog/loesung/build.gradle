plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Quellen enthalten Umlaute; ohne diese Zeile nimmt javac unter Windows Cp1252.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // Keine Versionsnummer mehr hier – alle stehen in gradle/libs.versions.toml.
    testImplementation platform(libs.junit.bom)
    testImplementation libs.bundles.test
    runtimeOnly libs.h2
    compileOnly libs.jetbrains.annotations
    testRuntimeOnly libs.junit.launcher
}

test {
    useJUnitPlatform()
    // Mockito lädt zur Laufzeit einen Agenten; ohne diesen Schalter warnt Java 21 davor.
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
